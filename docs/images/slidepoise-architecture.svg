<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="870" viewBox="0 0 1600 870" role="img" aria-labelledby="title desc"><title id="title">SlidePoise architecture</title><desc id="desc">The Agent plans slide content from the brief and source files. Visual design selects references and assets, assembles a contact sheet, generates a slide image and reviews the design. Interpretation and OpenCV measurement feed the PowerPoint build. The editable file is rendered and reviewed against the brief and generated slide image. Corrections return to the affected stages. Sage marks the brief and editable deck. Warm grey marks references and working files. White marks Agent and tool actions. Solid arrows show the workflow and dashed arrows show revisions.</desc><defs><marker id="stone-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#817362" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="gold-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#8f734b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="graphite-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#716e69" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="sage-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#647468" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mauve-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#7c6876" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="1600" height="870" rx="0" fill="#faf9f6" stroke="none"/><text x="64" y="62" font-family="Arial" font-size="28" fill="#292824" >How SlidePoise builds editable presentations</text><text x="1536" y="60" font-family="Arial" font-size="12" fill="#827b70" letter-spacing="1.4" text-anchor="end">ARCHITECTURE</text><text x="64" y="124" font-family="Arial" font-size="13" fill="#827b70" >01</text><text x="94" y="125" font-family="Arial" font-size="23" fill="#292824" >Content planning</text><path d="M64 145h240" fill="none" stroke="#ded9cf"/><text x="368" y="124" font-family="Arial" font-size="13" fill="#827b70" >02</text><text x="398" y="125" font-family="Arial" font-size="23" fill="#292824" >Visual design</text><path d="M368 145h336" fill="none" stroke="#ded9cf"/><text x="768" y="124" font-family="Arial" font-size="13" fill="#827b70" >03</text><text x="798" y="125" font-family="Arial" font-size="23" fill="#292824" >Reconstruction</text><path d="M768 145h432" fill="none" stroke="#ded9cf"/><text x="1264" y="124" font-family="Arial" font-size="13" fill="#827b70" >04</text><text x="1294" y="125" font-family="Arial" font-size="23" fill="#292824" >Review</text><path d="M1264 145h272" fill="none" stroke="#ded9cf"/><path d="M336 172V712M736 172V712M1232 172V712" fill="none" stroke="#e6e2da" stroke-width="1" opacity=".7"/><rect x="64" y="204" width="240" height="112" rx="4" fill="#e4ebe5" stroke="#dcd9d1"/><text x="84" y="236" font-family="Arial" font-size="21" fill="#292824" >Presentation brief</text><text x="84" y="265" font-family="Arial" font-size="16" fill="#827b70" >Audience and purpose</text><text x="84" y="289" font-family="Arial" font-size="16" fill="#827b70" >Evidence and constraints</text><rect x="368" y="204" width="336" height="112" rx="4" fill="#eeece7" stroke="#dcd9d1"/><text x="388" y="236" font-family="Arial" font-size="21" fill="#292824" >Reusable visual resources</text><text x="388" y="265" font-family="Arial" font-size="16" fill="#827b70" >Slide references, charts and tables</text><text x="388" y="289" font-family="Arial" font-size="16" fill="#827b70" >Open-source icons and logos</text><rect x="768" y="204" width="432" height="112" rx="4" fill="#eeece7" stroke="#dcd9d1"/><text x="788" y="236" font-family="Arial" font-size="21" fill="#292824" >Generated slide image</text><text x="788" y="265" font-family="Arial" font-size="16" fill="#827b70" >The selected visual design</text><text x="788" y="289" font-family="Arial" font-size="16" fill="#827b70" >for reconstructing editable objects</text><rect x="1264" y="204" width="272" height="112" rx="4" fill="#e4ebe5" stroke="#dcd9d1"/><text x="1284" y="236" font-family="Arial" font-size="21" fill="#292824" >Editable PowerPoint</text><text x="1284" y="265" font-family="Arial" font-size="16" fill="#827b70" >Text, charts and tables</text><text x="1284" y="289" font-family="Arial" font-size="16" fill="#827b70" >with separate artwork layers</text><path d="M184 318L184 366" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#stone-arrow)"/><rect x="64" y="374" width="240" height="96" rx="4" fill="#ffffff" stroke="#dcd9d1"/><text x="84" y="406" font-family="Arial" font-size="21" fill="#292824" >Plan each slide</text><text x="84" y="435" font-family="Arial" font-size="16" fill="#827b70" >Agent defines the message</text><text x="84" y="459" font-family="Arial" font-size="16" fill="#827b70" >and supporting evidence</text><path d="M184 472L184 574" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#stone-arrow)"/><rect x="64" y="582" width="240" height="110" rx="4" fill="#eeece7" stroke="#dcd9d1"/><text x="84" y="614" font-family="Arial" font-size="21" fill="#292824" >Slide-by-slide plan</text><text x="84" y="643" font-family="Arial" font-size="16" fill="#827b70" >Key messages, source data</text><text x="84" y="667" font-family="Arial" font-size="16" fill="#827b70" >and visual requirements</text><path d="M306 637h16V422h38" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#stone-arrow)"/><path d="M536 318L536 366" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#stone-arrow)"/><rect x="368" y="374" width="336" height="96" rx="4" fill="#ffffff" stroke="#dcd9d1"/><text x="388" y="406" font-family="Arial" font-size="21" fill="#292824" >Select references and assets</text><text x="388" y="435" font-family="Arial" font-size="16" fill="#827b70" >Agent retrieves material suited</text><text x="388" y="459" font-family="Arial" font-size="16" fill="#827b70" >to each slide’s message and layout</text><path d="M536 472L536 484" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#stone-arrow)"/><rect x="368" y="492" width="336" height="72" rx="4" fill="#eeece7" stroke="#dcd9d1"/><text x="388" y="521" font-family="Arial" font-size="21" fill="#292824" >Generation contact sheet</text><text x="388" y="547" font-family="Arial" font-size="16" fill="#827b70" >Visual guide to resources and style</text><path d="M536 566L536 574" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#stone-arrow)"/><rect x="368" y="582" width="336" height="110" rx="4" fill="#ffffff" stroke="#dcd9d1"/><text x="388" y="614" font-family="Arial" font-size="21" fill="#292824" >Generate the slide design</text><text x="388" y="643" font-family="Arial" font-size="16" fill="#827b70" >Image model produces a slide image</text><text x="388" y="667" font-family="Arial" font-size="16" fill="#827b70" >Agent checks content and layout</text><path d="M706 637h46V260h8" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#stone-arrow)"/><path d="M984 318v22H861v26" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#stone-arrow)"/><path d="M984 340h123v26" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#stone-arrow)"/><rect x="768" y="374" width="188" height="96" rx="4" fill="#ffffff" stroke="#dcd9d1"/><text x="788" y="406" font-family="Arial" font-size="18" fill="#292824" >Identify objects</text><text x="788" y="435" font-family="Arial" font-size="16" fill="#827b70" >Agent maps content</text><text x="788" y="459" font-family="Arial" font-size="16" fill="#827b70" >and groups elements</text><rect x="1012" y="374" width="188" height="96" rx="4" fill="#ffffff" stroke="#dcd9d1"/><text x="1032" y="406" font-family="Arial" font-size="18" fill="#292824" >Measure regions</text><text x="1032" y="435" font-family="Arial" font-size="16" fill="#827b70" >OpenCV finds edges</text><text x="1032" y="459" font-family="Arial" font-size="16" fill="#827b70" >and visible bounds</text><path d="M964 422h38" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  /><path d="M971 417l-7 5 7 5M995 417l7 5-7 5" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  /><text x="861" y="505" font-family="Arial" font-size="16" fill="#827b70" text-anchor="middle">Semantic object map</text><text x="1107" y="505" font-family="Arial" font-size="16" fill="#827b70" text-anchor="middle">Measured geometry</text><path d="M861 518v27h246v-27" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  /><path d="M984 545L984 574" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#stone-arrow)"/><rect x="768" y="582" width="432" height="110" rx="4" fill="#ffffff" stroke="#dcd9d1"/><text x="788" y="614" font-family="Arial" font-size="21" fill="#292824" >Build the editable PowerPoint</text><text x="788" y="647" font-family="Arial" font-size="16" fill="#827b70" >Reconstruction compiler combines objects and assets</text><text x="788" y="674" font-family="Arial" font-size="16" fill="#827b70" >PptxGenJS builds editable text, charts and tables</text><path d="M1202 637h46V260h8" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#stone-arrow)"/><path d="M1400 318L1400 366" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#stone-arrow)"/><rect x="1264" y="374" width="272" height="96" rx="4" fill="#ffffff" stroke="#dcd9d1"/><text x="1284" y="406" font-family="Arial" font-size="21" fill="#292824" >Render each slide</text><text x="1284" y="435" font-family="Arial" font-size="16" fill="#827b70" >LibreOffice or host renderer</text><text x="1284" y="459" font-family="Arial" font-size="16" fill="#827b70" >produces images for inspection</text><path d="M1400 472L1400 574" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#stone-arrow)"/><rect x="1264" y="582" width="272" height="110" rx="4" fill="#ffffff" stroke="#dcd9d1"/><text x="1284" y="614" font-family="Arial" font-size="21" fill="#292824" >Review and refine slides</text><text x="1284" y="641" font-family="Arial" font-size="15" fill="#827b70" >Agent checks slides against the brief</text><text x="1284" y="663" font-family="Arial" font-size="15" fill="#827b70" >and generated design, then corrects</text><text x="1284" y="685" font-family="Arial" font-size="15" fill="#827b70" >content and visual errors</text><path d="M1400 694v63H44V422h12" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6" marker-end="url(#stone-arrow)"/><path d="M400 757v-57" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6" marker-end="url(#stone-arrow)"/><path d="M984 757v-57" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6" marker-end="url(#stone-arrow)"/><rect x="542" y="736" width="292" height="25" rx="0" fill="#faf9f6" stroke="none"/><text x="548" y="754" font-family="Arial" font-size="15" fill="#817362" >Revise the affected slides and stages</text><rect x="64" y="812" width="20" height="20" rx="3" fill="#e4ebe5" stroke="#dcd9d1"/><text x="96" y="828" font-family="Arial" font-size="17" fill="#827b70" >Brief and editable deck</text><rect x="366" y="812" width="20" height="20" rx="3" fill="#eeece7" stroke="#dcd9d1"/><text x="398" y="828" font-family="Arial" font-size="17" fill="#827b70" >References and working files</text><rect x="738" y="812" width="20" height="20" rx="3" fill="#ffffff" stroke="#dcd9d1"/><text x="770" y="828" font-family="Arial" font-size="17" fill="#827b70" >Agent and tool actions</text><path d="M1090 822L1130 822" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#stone-arrow)"/><text x="1142" y="828" font-family="Arial" font-size="17" fill="#827b70" >Workflow</text><path d="M1340 822h40" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6" marker-end="url(#stone-arrow)"/><text x="1392" y="828" font-family="Arial" font-size="17" fill="#827b70" >Revisions</text></svg>