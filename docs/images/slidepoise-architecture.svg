<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc"><title id="title">SlidePoise workflow</title><desc id="desc">The Agent reviews the brief and source files, researches useful content where needed, then plans each slide. Visual design selects references and assets, assembles a contact sheet, generates a slide image and reviews the design. Interpretation and OpenCV measurement feed the PowerPoint build. The editable file is rendered and reviewed against the brief and generated slide image. Corrections return to the affected stages. Sage marks the brief and editable deck. Muted blue marks reusable visual resources. Warm grey marks working files. White marks Agent and tool actions. Solid arrows show the workflow and dashed arrows show revisions.</desc><defs><marker id="stone-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#817362" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="gold-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#8f734b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="graphite-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#716e69" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="sage-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#647468" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mauve-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#7c6876" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="1600" height="940" rx="0" fill="#faf9f6" stroke="none"/><defs><marker id="workflow-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#776650"/></marker></defs><text x="64" y="62" font-family="Arial" font-size="28" fill="#292824" >How SlidePoise builds editable presentations</text><text x="1536" y="60" font-family="Arial" font-size="12" fill="#827b70" letter-spacing="1.4" text-anchor="end">WORKFLOW</text><text x="64" y="124" font-family="Arial" font-size="13" fill="#827b70" >01</text><text x="94" y="125" font-family="Arial" font-size="23" fill="#292824" >Content planning</text><path d="M64 145h272" fill="none" stroke="#ded9cf"/><text x="400" y="124" font-family="Arial" font-size="13" fill="#827b70" >02</text><text x="430" y="125" font-family="Arial" font-size="23" fill="#292824" >Visual design</text><path d="M400 145h336" fill="none" stroke="#ded9cf"/><text x="800" y="124" font-family="Arial" font-size="13" fill="#827b70" >03</text><text x="830" y="125" font-family="Arial" font-size="23" fill="#292824" >Reconstruction</text><path d="M800 145h432" fill="none" stroke="#ded9cf"/><text x="1296" y="124" font-family="Arial" font-size="13" fill="#827b70" >04</text><text x="1326" y="125" font-family="Arial" font-size="23" fill="#292824" >Review</text><path d="M1296 145h240" fill="none" stroke="#ded9cf"/><rect x="64" y="204" width="272" height="100" rx="4" fill="#e4ebe5" stroke="#dcd9d1"/><text x="84" y="236" font-family="Arial" font-size="21" fill="#292824" >Presentation brief</text><text x="84" y="265" font-family="Arial" font-size="16" fill="#827b70" >Audience and purpose</text><text x="84" y="289" font-family="Arial" font-size="16" fill="#827b70" >Evidence and constraints</text><rect x="400" y="204" width="336" height="112" rx="4" fill="#e5eaf2" stroke="#dcd9d1"/><text x="420" y="236" font-family="Arial" font-size="21" fill="#292824" >Reusable visual resources</text><text x="420" y="265" font-family="Arial" font-size="16" fill="#827b70" >Slide references, charts and tables</text><text x="420" y="289" font-family="Arial" font-size="16" fill="#827b70" >Open-source icons and logos</text><rect x="800" y="204" width="432" height="112" rx="4" fill="#eeece7" stroke="#dcd9d1"/><text x="820" y="236" font-family="Arial" font-size="21" fill="#292824" >Generated slide image</text><text x="820" y="265" font-family="Arial" font-size="16" fill="#827b70" >The selected visual design</text><text x="820" y="289" font-family="Arial" font-size="16" fill="#827b70" >for reconstructing editable objects</text><rect x="1296" y="204" width="240" height="112" rx="4" fill="#e4ebe5" stroke="#dcd9d1"/><text x="1316" y="236" font-family="Arial" font-size="21" fill="#292824" >Editable PowerPoint</text><text x="1316" y="265" font-family="Arial" font-size="16" fill="#827b70" >Text, charts and tables</text><text x="1316" y="289" font-family="Arial" font-size="16" fill="#827b70" >Separate artwork layers</text><path d="M200 312L200 338" fill="none" stroke="#776650" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#workflow-arrow)" /><rect x="64" y="350" width="272" height="112" rx="4" fill="#ffffff" stroke="#dcd9d1"/><text x="84" y="382" font-family="Arial" font-size="21" fill="#292824" >Review source material</text><text x="84" y="411" font-family="Arial" font-size="16" fill="#827b70" >Agent reviews sources and</text><text x="84" y="435" font-family="Arial" font-size="16" fill="#827b70" >researches content as needed</text><path d="M200 470L200 504" fill="none" stroke="#776650" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#workflow-arrow)" /><rect x="64" y="516" width="272" height="96" rx="4" fill="#ffffff" stroke="#dcd9d1"/><text x="84" y="548" font-family="Arial" font-size="21" fill="#292824" >Plan each slide</text><text x="84" y="577" font-family="Arial" font-size="16" fill="#827b70" >Agent defines the message</text><text x="84" y="601" font-family="Arial" font-size="16" fill="#827b70" >and supporting evidence</text><path d="M200 620L200 654" fill="none" stroke="#776650" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#workflow-arrow)" /><rect x="64" y="666" width="272" height="100" rx="4" fill="#eeece7" stroke="#dcd9d1"/><text x="84" y="698" font-family="Arial" font-size="21" fill="#292824" >Slide-by-slide plan</text><text x="84" y="727" font-family="Arial" font-size="16" fill="#827b70" >Key messages, source data</text><text x="84" y="751" font-family="Arial" font-size="16" fill="#827b70" >and visual requirements</text><path d="M344 716h24V422h20" fill="none" stroke="#776650" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#workflow-arrow)" /><path d="M568 324L568 362" fill="none" stroke="#776650" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#workflow-arrow)" /><rect x="400" y="374" width="336" height="96" rx="4" fill="#ffffff" stroke="#dcd9d1"/><text x="420" y="406" font-family="Arial" font-size="21" fill="#292824" >Select references and assets</text><text x="420" y="435" font-family="Arial" font-size="16" fill="#827b70" >Agent retrieves material suited</text><text x="420" y="459" font-family="Arial" font-size="16" fill="#827b70" >to each slide’s message and layout</text><path d="M568 478L568 504" fill="none" stroke="#776650" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#workflow-arrow)" /><rect x="400" y="516" width="336" height="72" rx="4" fill="#eeece7" stroke="#dcd9d1"/><text x="420" y="545" font-family="Arial" font-size="21" fill="#292824" >Generation contact sheet</text><text x="420" y="571" font-family="Arial" font-size="16" fill="#827b70" >Visual guide to resources and style</text><path d="M568 596L568 622" fill="none" stroke="#776650" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#workflow-arrow)" /><rect x="400" y="634" width="336" height="110" rx="4" fill="#ffffff" stroke="#dcd9d1"/><text x="420" y="666" font-family="Arial" font-size="21" fill="#292824" >Generate the slide design</text><text x="420" y="695" font-family="Arial" font-size="16" fill="#827b70" >Image model produces a slide image</text><text x="420" y="719" font-family="Arial" font-size="16" fill="#827b70" >Agent checks content and layout</text><path d="M744 689h24V260h20" fill="none" stroke="#776650" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#workflow-arrow)" /><path d="M1016 324v36H893v41" fill="none" stroke="#776650" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#workflow-arrow)" /><path d="M1016 360h123v41" fill="none" stroke="#776650" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#workflow-arrow)" /><rect x="800" y="413" width="188" height="124" rx="4" fill="#ffffff" stroke="#dcd9d1"/><text x="820" y="445" font-family="Arial" font-size="18" fill="#292824" >Identify objects</text><text x="820" y="474" font-family="Arial" font-size="15" fill="#827b70" >Agent records meaning</text><text x="820" y="496" font-family="Arial" font-size="15" fill="#827b70" >and relationships in a</text><text x="820" y="518" font-family="Arial" font-size="15" fill="#827b70" >semantic map</text><rect x="1044" y="413" width="188" height="124" rx="4" fill="#ffffff" stroke="#dcd9d1"/><text x="1064" y="445" font-family="Arial" font-size="18" fill="#292824" >Measure regions</text><text x="1064" y="474" font-family="Arial" font-size="15" fill="#827b70" >OpenCV records visible</text><text x="1064" y="496" font-family="Arial" font-size="15" fill="#827b70" >bounds, contours</text><text x="1064" y="518" font-family="Arial" font-size="15" fill="#827b70" >and colours</text><path d="M1000 475h32" fill="none" stroke="#776650" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#workflow-arrow)" marker-start="url(#workflow-arrow)"/><path d="M893 545v39h246v-39" fill="none" stroke="#776650" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"   /><path d="M1016 584L1016 622" fill="none" stroke="#776650" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#workflow-arrow)" /><rect x="800" y="634" width="432" height="110" rx="4" fill="#ffffff" stroke="#dcd9d1"/><text x="820" y="666" font-family="Arial" font-size="21" fill="#292824" >Build the editable PowerPoint</text><text x="820" y="699" font-family="Arial" font-size="16" fill="#827b70" >Reconstruction compiler combines objects and assets</text><text x="820" y="726" font-family="Arial" font-size="16" fill="#827b70" >PptxGenJS builds editable text, charts and tables</text><path d="M1240 689h24V260h20" fill="none" stroke="#776650" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#workflow-arrow)" /><path d="M1416 324L1416 415" fill="none" stroke="#776650" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#workflow-arrow)" /><rect x="1296" y="427" width="240" height="96" rx="4" fill="#ffffff" stroke="#dcd9d1"/><text x="1316" y="459" font-family="Arial" font-size="21" fill="#292824" >Render each slide</text><text x="1316" y="488" font-family="Arial" font-size="16" fill="#827b70" >LibreOffice or host renderer</text><text x="1316" y="512" font-family="Arial" font-size="16" fill="#827b70" >creates preview images</text><path d="M1416 531L1416 622" fill="none" stroke="#776650" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#workflow-arrow)" /><rect x="1296" y="634" width="240" height="110" rx="4" fill="#ffffff" stroke="#dcd9d1"/><text x="1316" y="666" font-family="Arial" font-size="21" fill="#292824" >Review and refine</text><text x="1316" y="693" font-family="Arial" font-size="15" fill="#827b70" >Agent checks the brief</text><text x="1316" y="715" font-family="Arial" font-size="15" fill="#827b70" >and design, then corrects</text><text x="1316" y="737" font-family="Arial" font-size="15" fill="#827b70" >content and visual errors</text><path d="M1416 752v56H32V406h20" fill="none" stroke="#776650" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#workflow-arrow)" /><path d="M568 808v-52" fill="none" stroke="#776650" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#workflow-arrow)" /><path d="M1016 808v-52" fill="none" stroke="#776650" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#workflow-arrow)" /><rect x="646" y="787" width="292" height="25" rx="0" fill="#faf9f6" stroke="none"/><text x="792" y="805" font-family="Arial" font-size="15" fill="#817362" text-anchor="middle">Revise the affected slides and stages</text><rect x="64" y="882" width="20" height="20" rx="3" fill="#e4ebe5" stroke="#dcd9d1"/><text x="96" y="898" font-family="Arial" font-size="17" fill="#827b70" >Brief and editable deck</text><rect x="340" y="882" width="20" height="20" rx="3" fill="#e5eaf2" stroke="#dcd9d1"/><text x="372" y="898" font-family="Arial" font-size="17" fill="#827b70" >Reusable resources</text><rect x="598" y="882" width="20" height="20" rx="3" fill="#eeece7" stroke="#dcd9d1"/><text x="630" y="898" font-family="Arial" font-size="17" fill="#827b70" >Working files</text><rect x="824" y="882" width="20" height="20" rx="3" fill="#ffffff" stroke="#dcd9d1"/><text x="856" y="898" font-family="Arial" font-size="17" fill="#827b70" >Agent and tool actions</text><path d="M1120 892L1160 892" fill="none" stroke="#776650" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#workflow-arrow)" /><text x="1172" y="898" font-family="Arial" font-size="17" fill="#827b70" >Workflow</text><path d="M1350 892h40" fill="none" stroke="#776650" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#workflow-arrow)" /><text x="1402" y="898" font-family="Arial" font-size="17" fill="#827b70" >Revisions</text></svg>