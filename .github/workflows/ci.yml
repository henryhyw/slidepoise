name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,runtime]"
      - run: npm ci
      - run: python -m pytest -q --junitxml=workspace/test-results/python.xml
      - run: npm test
      - run: python -m unittest discover -s docs/site -p "test_*.py"
      - run: node --check docs/site/app.mjs
      - run: node --check docs/site/object-inspector.mjs
      - run: python -m ruff check --select E9,F63,F7,F82 framework webapp slidepoise tests setup.py
      - run: python slidepoise/scripts/preflight_config.py framework/defaults/slidepoise-config.json
      - run: python slidepoise/scripts/preflight_catalogs.py --profiles-root profiles
      - run: python slidepoise/scripts/audit_skill_boundaries.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: workspace/test-results/
          if-no-files-found: ignore

  preview:
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SLIDEPOISE_REQUIRE_PREVIEW: "1"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: sudo apt-get update
      - run: sudo apt-get install -y libreoffice-impress poppler-utils fonts-noto-cjk
      - run: python -m pip install -e ".[dev,runtime]"
      - run: npm ci
      - run: >-
          python -m pytest tests/test_preview_rendering.py tests/test_connector_rendering.py
          tests/test_chart_label_wrapping.py tests/test_master_frame.py tests/test_native_shape_ids.py
          -q --basetemp=workspace/preview-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-presentation-evidence
          path: |
            workspace/preview-tests/**/*.pptx
            workspace/preview-tests/**/*.pdf
            workspace/preview-tests/**/*.png
            workspace/preview-tests/**/*.source.json
          if-no-files-found: warn

  package:
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install --upgrade build
      - run: npm ci
      - run: python -m build
      - run: npm pack --dry-run
      - run: python -m pip install dist/*.whl
      - run: slidepoise --version
        working-directory: ${{ runner.temp }}
      - run: slidepoise setup --skip-skill
        working-directory: ${{ runner.temp }}
      - run: slidepoise doctor
        working-directory: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
