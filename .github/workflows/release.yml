name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SLIDEPOISE_REQUIRE_PREVIEW: "1"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: sudo apt-get update
      - run: sudo apt-get install -y libreoffice-impress poppler-utils fonts-noto-cjk
      - run: python -m pip install -e ".[dev,runtime]"
      - run: npm ci
      - run: python -m pytest -q
      - run: npm test
      - run: python -m ruff check --select E9,F63,F7,F82 framework webapp slidepoise tests setup.py
      - run: python slidepoise/scripts/preflight_config.py framework/defaults/slidepoise-config.json
      - run: python slidepoise/scripts/preflight_catalogs.py --profiles-root profiles
      - run: python slidepoise/scripts/audit_skill_boundaries.py
      - run: python -m build
      - run: npm pack
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            slidepoise-*.tgz
